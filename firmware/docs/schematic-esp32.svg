<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" font-family="Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <style>
      .ttl{font-size:24px;font-weight:700;fill:#0f172a;font-family:Segoe UI,Arial,sans-serif}
      .sub{font-size:14px;fill:#64748b;font-family:Segoe UI,Arial,sans-serif}
      .ic{fill:#fffbeb;stroke:#92400e;stroke-width:2}
      .icname{font-size:16px;font-weight:700;fill:#92400e;font-family:Segoe UI,Arial,sans-serif}
      .modbox{fill:#f8fafc;stroke:#334155;stroke-width:1.5}
      .modname{font-size:14px;font-weight:700;fill:#0f172a;font-family:Segoe UI,Arial,sans-serif}
      .pinname{font-size:13px;fill:#0f172a}
      .gname{font-size:12px;fill:#334155}
      .wire{stroke:#0f172a;stroke-width:1.6;fill:none}
      .net{font-size:11px;font-weight:700;fill:#3730a3}
      .pwr{font-size:12px;font-weight:700;fill:#b91c1c;font-family:Segoe UI,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1300" height="900" fill="#ffffff"/>
  <text x="40" y="42" class="ttl">Schéma électronique — Borne de pointage ESP32</text>
  <text x="40" y="66" class="sub">Connexions par labels de net globaux : les broches portant le même label sont électriquement reliées. (Conforme à firmware/src/config.h)</text>

  <!-- ===== U1 ESP32 ===== -->
  <text x="135" y="160" class="icname">U1 — ESP32-DevKitC</text>
  <rect x="150" y="175" width="190" height="600" rx="6" class="ic"/>

  <!-- Left power pins -->
  <g class="gname" text-anchor="start">
    <text x="158" y="224">3V3</text>
    <text x="158" y="284">GND</text>
    <text x="158" y="344">VIN</text>
  </g>
  <line class="wire" x1="150" y1="220" x2="95" y2="220"/>
  <line class="wire" x1="150" y1="280" x2="95" y2="280"/>
  <line class="wire" x1="150" y1="340" x2="95" y2="340"/>
  <!-- +3V3 symbol -->
  <line class="wire" x1="95" y1="220" x2="95" y2="205"/>
  <line class="wire" x1="80" y1="205" x2="110" y2="205"/>
  <text x="95" y="198" text-anchor="middle" class="pwr">+3V3</text>
  <!-- GND symbol -->
  <line class="wire" x1="95" y1="280" x2="95" y2="298"/>
  <line class="wire" x1="80" y1="298" x2="110" y2="298"/>
  <line class="wire" x1="84" y1="304" x2="106" y2="304"/>
  <line class="wire" x1="88" y1="310" x2="102" y2="310"/>
  <!-- +5V symbol -->
  <line class="wire" x1="95" y1="340" x2="95" y2="325"/>
  <line class="wire" x1="80" y1="325" x2="110" y2="325"/>
  <text x="95" y="358" text-anchor="middle" class="pwr">+5V (PS1)</text>

  <!-- Right IO pins: name inside + stub + net pill -->
  <!-- helper layout: each row -->
  <!-- row generator (manually placed) -->
  <g class="gname" text-anchor="end">
    <text x="332" y="214">IO5</text>
    <text x="332" y="242">IO18</text>
    <text x="332" y="270">IO23</text>
    <text x="332" y="298">IO19</text>
    <text x="332" y="326">IO4</text>
    <text x="332" y="354">IO21</text>
    <text x="332" y="382">IO22</text>
    <text x="332" y="410">IO16</text>
    <text x="332" y="438">IO17</text>
    <text x="332" y="466">IO13</text>
    <text x="332" y="494">IO14</text>
    <text x="332" y="522">IO27</text>
    <text x="332" y="550">IO26</text>
    <text x="332" y="578">IO25</text>
    <text x="332" y="606">IO33</text>
    <text x="332" y="634">IO32</text>
    <text x="332" y="662">IO2</text>
    <text x="332" y="690">IO15</text>
    <text x="332" y="718">IO12</text>
  </g>
  <!-- stubs -->
  <g class="wire">
    <line x1="340" y1="210" x2="384" y2="210"/>
    <line x1="340" y1="238" x2="384" y2="238"/>
    <line x1="340" y1="266" x2="384" y2="266"/>
    <line x1="340" y1="294" x2="384" y2="294"/>
    <line x1="340" y1="322" x2="384" y2="322"/>
    <line x1="340" y1="350" x2="384" y2="350"/>
    <line x1="340" y1="378" x2="384" y2="378"/>
    <line x1="340" y1="406" x2="384" y2="406"/>
    <line x1="340" y1="434" x2="384" y2="434"/>
    <line x1="340" y1="462" x2="384" y2="462"/>
    <line x1="340" y1="490" x2="384" y2="490"/>
    <line x1="340" y1="518" x2="384" y2="518"/>
    <line x1="340" y1="546" x2="384" y2="546"/>
    <line x1="340" y1="574" x2="384" y2="574"/>
    <line x1="340" y1="602" x2="384" y2="602"/>
    <line x1="340" y1="630" x2="384" y2="630"/>
    <line x1="340" y1="658" x2="384" y2="658"/>
    <line x1="340" y1="686" x2="384" y2="686"/>
    <line x1="340" y1="714" x2="384" y2="714"/>
  </g>
  <!-- net pills (ESP side) -->
  <g>
    <g><rect x="384" y="199" width="120" height="22" rx="11" fill="#eef2ff" stroke="#6366f1"/><text x="444" y="214" text-anchor="middle" class="net">SS_RFID</text></g>
    <g><rect x="384" y="227" width="120" height="22" rx="11" fill="#eef2ff" stroke="#6366f1"/><text x="444" y="242" text-anchor="middle" class="net">SPI_SCK</text></g>
    <g><rect x="384" y="255" width="120" height="22" rx="11" fill="#eef2ff" stroke="#6366f1"/><text x="444" y="270" text-anchor="middle" class="net">SPI_MOSI</text></g>
    <g><rect x="384" y="283" width="120" height="22" rx="11" fill="#eef2ff" stroke="#6366f1"/><text x="444" y="298" text-anchor="middle" class="net">SPI_MISO</text></g>
    <g><rect x="384" y="311" width="120" height="22" rx="11" fill="#eef2ff" stroke="#6366f1"/><text x="444" y="326" text-anchor="middle" class="net">RST_RFID</text></g>
    <g><rect x="384" y="339" width="120" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/><text x="444" y="354" text-anchor="middle" class="net">I2C_SDA</text></g>
    <g><rect x="384" y="367" width="120" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/><text x="444" y="382" text-anchor="middle" class="net">I2C_SCL</text></g>
    <g><rect x="384" y="395" width="120" height="22" rx="11" fill="#ede9fe" stroke="#7c3aed"/><text x="444" y="410" text-anchor="middle" class="net">FP_TX</text></g>
    <g><rect x="384" y="423" width="120" height="22" rx="11" fill="#ede9fe" stroke="#7c3aed"/><text x="444" y="438" text-anchor="middle" class="net">FP_RX</text></g>
    <g><rect x="384" y="451" width="120" height="22" rx="11" fill="#ffedd5" stroke="#ea580c"/><text x="444" y="466" text-anchor="middle" class="net">KP_ROW1</text></g>
    <g><rect x="384" y="479" width="120" height="22" rx="11" fill="#ffedd5" stroke="#ea580c"/><text x="444" y="494" text-anchor="middle" class="net">KP_ROW2</text></g>
    <g><rect x="384" y="507" width="120" height="22" rx="11" fill="#ffedd5" stroke="#ea580c"/><text x="444" y="522" text-anchor="middle" class="net">KP_ROW3</text></g>
    <g><rect x="384" y="535" width="120" height="22" rx="11" fill="#ffedd5" stroke="#ea580c"/><text x="444" y="550" text-anchor="middle" class="net">KP_ROW4</text></g>
    <g><rect x="384" y="563" width="120" height="22" rx="11" fill="#ffedd5" stroke="#ea580c"/><text x="444" y="578" text-anchor="middle" class="net">KP_COL1</text></g>
    <g><rect x="384" y="591" width="120" height="22" rx="11" fill="#ffedd5" stroke="#ea580c"/><text x="444" y="606" text-anchor="middle" class="net">KP_COL2</text></g>
    <g><rect x="384" y="619" width="120" height="22" rx="11" fill="#ffedd5" stroke="#ea580c"/><text x="444" y="634" text-anchor="middle" class="net">KP_COL3</text></g>
    <g><rect x="384" y="647" width="120" height="22" rx="11" fill="#ffedd5" stroke="#ea580c"/><text x="444" y="662" text-anchor="middle" class="net">KP_COL4</text></g>
    <g><rect x="384" y="675" width="120" height="22" rx="11" fill="#cffafe" stroke="#0891b2"/><text x="444" y="690" text-anchor="middle" class="net">BUZZER</text></g>
    <g><rect x="384" y="703" width="120" height="22" rx="11" fill="#fef9c3" stroke="#ca8a04"/><text x="444" y="718" text-anchor="middle" class="net">LED_ST</text></g>
  </g>

  <!-- ===== U2 RC522 ===== -->
  <text x="600" y="150" class="modname">U2 — RC522 (RFID, SPI)</text>
  <rect x="600" y="160" width="250" height="180" rx="6" class="modbox"/>
  <g class="pinname"><text x="612" y="188">SDA/SS</text><text x="612" y="212">SCK</text><text x="612" y="236">MOSI</text><text x="612" y="260">MISO</text><text x="612" y="284">RST</text><text x="612" y="308">3V3</text><text x="612" y="332">GND</text></g>
  <g>
    <g><rect x="742" y="177" width="96" height="20" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="790" y="191" text-anchor="middle" class="net">SS_RFID</text></g>
    <g><rect x="742" y="201" width="96" height="20" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="790" y="215" text-anchor="middle" class="net">SPI_SCK</text></g>
    <g><rect x="742" y="225" width="96" height="20" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="790" y="239" text-anchor="middle" class="net">SPI_MOSI</text></g>
    <g><rect x="742" y="249" width="96" height="20" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="790" y="263" text-anchor="middle" class="net">SPI_MISO</text></g>
    <g><rect x="742" y="273" width="96" height="20" rx="10" fill="#eef2ff" stroke="#6366f1"/><text x="790" y="287" text-anchor="middle" class="net">RST_RFID</text></g>
    <g><rect x="742" y="297" width="96" height="20" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="790" y="311" text-anchor="middle" class="net">+3V3</text></g>
    <g><rect x="742" y="321" width="96" height="20" rx="10" fill="#e5e7eb" stroke="#111827"/><text x="790" y="335" text-anchor="middle" class="net">GND</text></g>
  </g>

  <!-- ===== U3 AS608 ===== -->
  <text x="600" y="378" class="modname">U3 — AS608 (Empreinte, UART2)</text>
  <rect x="600" y="388" width="250" height="130" rx="6" class="modbox"/>
  <g class="pinname"><text x="612" y="416">TX (capteur)</text><text x="612" y="442">RX (capteur)</text><text x="612" y="468">VCC</text><text x="612" y="494">GND</text></g>
  <g>
    <g><rect x="742" y="405" width="96" height="20" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="790" y="419" text-anchor="middle" class="net">FP_TX</text></g>
    <g><rect x="742" y="431" width="96" height="20" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="790" y="445" text-anchor="middle" class="net">FP_RX</text></g>
    <g><rect x="742" y="457" width="96" height="20" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="790" y="471" text-anchor="middle" class="net">+3V3</text></g>
    <g><rect x="742" y="483" width="96" height="20" rx="10" fill="#e5e7eb" stroke="#111827"/><text x="790" y="497" text-anchor="middle" class="net">GND</text></g>
  </g>
  <text x="600" y="512" class="sub" font-size="11">Note : TX capteur → IO16 (RX2), RX capteur → IO17 (TX2)</text>

  <!-- ===== SW1 Keypad ===== -->
  <text x="600" y="556" class="modname">SW1 — Clavier 4×4</text>
  <rect x="600" y="566" width="250" height="226" rx="6" class="modbox"/>
  <g class="pinname"><text x="612" y="592">Ligne 1</text><text x="612" y="616">Ligne 2</text><text x="612" y="640">Ligne 3</text><text x="612" y="664">Ligne 4</text><text x="612" y="688">Col 1</text><text x="612" y="712">Col 2</text><text x="612" y="736">Col 3</text><text x="612" y="760">Col 4</text></g>
  <g>
    <g><rect x="742" y="581" width="96" height="20" rx="10" fill="#ffedd5" stroke="#ea580c"/><text x="790" y="595" text-anchor="middle" class="net">KP_ROW1</text></g>
    <g><rect x="742" y="605" width="96" height="20" rx="10" fill="#ffedd5" stroke="#ea580c"/><text x="790" y="619" text-anchor="middle" class="net">KP_ROW2</text></g>
    <g><rect x="742" y="629" width="96" height="20" rx="10" fill="#ffedd5" stroke="#ea580c"/><text x="790" y="643" text-anchor="middle" class="net">KP_ROW3</text></g>
    <g><rect x="742" y="653" width="96" height="20" rx="10" fill="#ffedd5" stroke="#ea580c"/><text x="790" y="667" text-anchor="middle" class="net">KP_ROW4</text></g>
    <g><rect x="742" y="677" width="96" height="20" rx="10" fill="#ffedd5" stroke="#ea580c"/><text x="790" y="691" text-anchor="middle" class="net">KP_COL1</text></g>
    <g><rect x="742" y="701" width="96" height="20" rx="10" fill="#ffedd5" stroke="#ea580c"/><text x="790" y="715" text-anchor="middle" class="net">KP_COL2</text></g>
    <g><rect x="742" y="725" width="96" height="20" rx="10" fill="#ffedd5" stroke="#ea580c"/><text x="790" y="739" text-anchor="middle" class="net">KP_COL3</text></g>
    <g><rect x="742" y="749" width="96" height="20" rx="10" fill="#ffedd5" stroke="#ea580c"/><text x="790" y="763" text-anchor="middle" class="net">KP_COL4</text></g>
  </g>

  <!-- ===== U4 OLED ===== -->
  <text x="930" y="150" class="modname">U4 — OLED SSD1306 (I2C)</text>
  <rect x="930" y="160" width="250" height="130" rx="6" class="modbox"/>
  <g class="pinname"><text x="942" y="188">SDA</text><text x="942" y="214">SCL</text><text x="942" y="240">VCC</text><text x="942" y="266">GND</text></g>
  <g>
    <g><rect x="1072" y="177" width="96" height="20" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="1120" y="191" text-anchor="middle" class="net">I2C_SDA</text></g>
    <g><rect x="1072" y="203" width="96" height="20" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="1120" y="217" text-anchor="middle" class="net">I2C_SCL</text></g>
    <g><rect x="1072" y="229" width="96" height="20" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="1120" y="243" text-anchor="middle" class="net">+3V3</text></g>
    <g><rect x="1072" y="255" width="96" height="20" rx="10" fill="#e5e7eb" stroke="#111827"/><text x="1120" y="269" text-anchor="middle" class="net">GND</text></g>
  </g>

  <!-- ===== D1 / R1 LED subcircuit ===== -->
  <text x="930" y="330" class="modname">D1 / R1 — LED de statut</text>
  <rect x="930" y="340" width="250" height="120" rx="6" class="modbox"/>
  <!-- net LED_ST -->
  <g><rect x="942" y="385" width="80" height="20" rx="10" fill="#fef9c3" stroke="#ca8a04"/><text x="982" y="399" text-anchor="middle" class="net">LED_ST</text></g>
  <line class="wire" x1="1022" y1="395" x2="1052" y2="395"/>
  <!-- R1 resistor (IEC box) -->
  <rect x="1052" y="387" width="44" height="16" fill="#fff" stroke="#0f172a"/>
  <text x="1074" y="378" text-anchor="middle" class="gname">R1 220Ω</text>
  <line class="wire" x1="1096" y1="395" x2="1116" y2="395"/>
  <!-- LED symbol -->
  <polygon points="1116,387 1116,403 1130,395" fill="#fff" stroke="#0f172a"/>
  <line class="wire" x1="1130" y1="385" x2="1130" y2="405"/>
  <text x="1124" y="372" text-anchor="middle" class="gname">D1</text>
  <line class="wire" x1="1130" y1="395" x2="1150" y2="395"/>
  <!-- to GND -->
  <line class="wire" x1="1150" y1="395" x2="1150" y2="425"/>
  <line class="wire" x1="1138" y1="425" x2="1162" y2="425"/>
  <line class="wire" x1="1142" y1="431" x2="1158" y2="431"/>
  <line class="wire" x1="1146" y1="437" x2="1154" y2="437"/>
  <text x="1150" y="452" text-anchor="middle" class="net">GND</text>

  <!-- ===== BZ1 Buzzer subcircuit ===== -->
  <text x="930" y="500" class="modname">BZ1 — Buzzer actif</text>
  <rect x="930" y="510" width="250" height="110" rx="6" class="modbox"/>
  <g><rect x="942" y="555" width="80" height="20" rx="10" fill="#cffafe" stroke="#0891b2"/><text x="982" y="569" text-anchor="middle" class="net">BUZZER</text></g>
  <line class="wire" x1="1022" y1="565" x2="1060" y2="565"/>
  <circle cx="1085" cy="565" r="22" fill="#fff" stroke="#0f172a"/>
  <text x="1085" y="570" text-anchor="middle" class="gname">BZ</text>
  <text x="1066" y="560" class="gname">+</text>
  <line class="wire" x1="1085" y1="587" x2="1085" y2="600"/>
  <line class="wire" x1="1073" y1="600" x2="1097" y2="600"/>
  <line class="wire" x1="1077" y1="606" x2="1093" y2="606"/>
  <text x="1130" y="600" class="net">GND</text>

  <!-- ===== PS1 Power ===== -->
  <text x="930" y="660" class="modname">PS1 — Alimentation 5V/2A</text>
  <rect x="930" y="670" width="250" height="120" rx="6" class="modbox"/>
  <g class="pinname"><text x="942" y="700">+5V</text><text x="942" y="726">GND</text></g>
  <g>
    <g><rect x="1072" y="689" width="96" height="20" rx="10" fill="#fee2e2" stroke="#b91c1c"/><text x="1120" y="703" text-anchor="middle" class="net">+5V</text></g>
    <g><rect x="1072" y="715" width="96" height="20" rx="10" fill="#e5e7eb" stroke="#111827"/><text x="1120" y="729" text-anchor="middle" class="net">GND</text></g>
  </g>
  <text x="942" y="760" class="sub" font-size="11">Le régulateur 3V3 de l'ESP32</text>
  <text x="942" y="776" class="sub" font-size="11">alimente les modules (net +3V3).</text>

  <!-- Legend -->
  <text x="40" y="815" class="sub">Labels : SPI (violet/bleu) · I2C (vert) · UART (lavande) · GPIO clavier (orange) · Buzzer (cyan) · LED (jaune) · Alim (+3V3/+5V/GND).</text>
  <text x="40" y="836" class="sub">⚠️ IO0/IO2/IO12/IO15 = strapping pins (vérifier les niveaux au boot). Relier toutes les masses (GND commun).</text>
  <text x="40" y="862" class="sub">Astuce KiCad : reproduire ces labels en « Global Labels » ; voir aussi pointage-esp32.net pour la connectivité complète.</text>
</svg>
