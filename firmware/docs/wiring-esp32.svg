<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .title{font-size:28px;font-weight:700;fill:#0f172a}
      .sub{font-size:15px;fill:#64748b}
      .mod{font-size:18px;font-weight:700;fill:#0f172a}
      .pin{font-size:14px;fill:#0f172a}
      .gpio{font-size:14px;font-weight:700}
      .buslbl{font-size:13px;font-weight:700;fill:#fff}
      .legend{font-size:14px;fill:#0f172a}
      .note{font-size:13px;fill:#64748b}
      .wire{stroke-width:4;fill:none}
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Borne de pointage ESP32 — Schéma de câblage</text>
  <text x="40" y="74" class="sub">Badge (RC522) · Empreinte (AS608) · Code (clavier 4×4) · Écran OLED · Buzzer · LED  —  brochage de firmware/src/config.h</text>

  <!-- ===================== ESP32 BOARD ===================== -->
  <g filter="url(#shadow)">
    <rect x="500" y="250" width="200" height="470" rx="14" fill="#0f3d3e"/>
  </g>
  <rect x="520" y="262" width="160" height="34" rx="6" fill="#115e59"/>
  <text x="600" y="285" text-anchor="middle" fill="#ecfeff" font-size="17" font-weight="700">ESP32 DevKit</text>
  <rect x="585" y="300" width="30" height="16" rx="3" fill="#334155"/>
  <text x="600" y="700" text-anchor="middle" fill="#94a3b8" font-size="12">USB / 5V</text>

  <!-- left edge connection nubs -->
  <circle cx="500" cy="350" r="6" fill="#2563eb"/>
  <circle cx="500" cy="470" r="6" fill="#ea580c"/>
  <circle cx="500" cy="560" r="6" fill="#e11d48"/>
  <circle cx="500" cy="585" r="6" fill="#111827"/>
  <!-- right edge connection nubs -->
  <circle cx="700" cy="330" r="6" fill="#16a34a"/>
  <circle cx="700" cy="430" r="6" fill="#7c3aed"/>
  <circle cx="700" cy="520" r="6" fill="#0891b2"/>
  <circle cx="700" cy="575" r="6" fill="#ca8a04"/>

  <!-- ===================== RC522 (top-left, SPI) ===================== -->
  <g filter="url(#shadow)"><rect x="60" y="100" width="270" height="180" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="80" y="130" class="mod">🪪 RC522 — RFID/NFC (SPI)</text>
  <g class="pin">
    <text x="80" y="158">SDA / SS</text><text x="300" y="158" text-anchor="end" class="gpio" fill="#2563eb">GPIO5</text>
    <text x="80" y="180">SCK</text>      <text x="300" y="180" text-anchor="end" class="gpio" fill="#2563eb">GPIO18</text>
    <text x="80" y="202">MOSI</text>     <text x="300" y="202" text-anchor="end" class="gpio" fill="#2563eb">GPIO23</text>
    <text x="80" y="224">MISO</text>     <text x="300" y="224" text-anchor="end" class="gpio" fill="#2563eb">GPIO19</text>
    <text x="80" y="246">RST</text>      <text x="300" y="246" text-anchor="end" class="gpio" fill="#2563eb">GPIO4</text>
    <text x="80" y="268">3V3 / GND</text><text x="300" y="268" text-anchor="end" fill="#64748b">3V3 · GND</text>
  </g>
  <path class="wire" stroke="#2563eb" d="M330,200 C420,220 430,330 500,350"/>
  <rect x="372" y="262" width="46" height="20" rx="10" fill="#2563eb"/><text x="395" y="277" text-anchor="middle" class="buslbl">SPI</text>

  <!-- ===================== KEYPAD (bottom-left, GPIO) ===================== -->
  <g filter="url(#shadow)"><rect x="60" y="470" width="290" height="270" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="80" y="500" class="mod">🔢 Clavier 4×4 (GPIO)</text>
  <g class="pin">
    <text x="80" y="528">Lignes (R1–R4)</text><text x="330" y="528" text-anchor="end" class="gpio" fill="#ea580c">13 · 14 · 27 · 26</text>
    <text x="80" y="552">Colonnes (C1–C4)</text><text x="330" y="552" text-anchor="end" class="gpio" fill="#ea580c">25 · 33 · 32 · 2</text>
  </g>
  <!-- mini keypad grid -->
  <g>
    <rect x="110" y="575" width="150" height="150" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <g font-size="16" font-weight="700" fill="#334155" text-anchor="middle">
      <text x="147" y="605">1</text><text x="184" y="605">2</text><text x="221" y="605">3</text><text x="252" y="605">A</text>
      <text x="147" y="640">4</text><text x="184" y="640">5</text><text x="221" y="640">6</text><text x="252" y="640">B</text>
      <text x="147" y="675">7</text><text x="184" y="675">8</text><text x="221" y="675">9</text><text x="252" y="675">C</text>
      <text x="147" y="710">*</text><text x="184" y="710">0</text><text x="221" y="710">#</text><text x="252" y="710">D</text>
    </g>
  </g>
  <path class="wire" stroke="#ea580c" d="M350,540 C430,520 430,470 500,470"/>
  <rect x="395" y="486" width="56" height="20" rx="10" fill="#ea580c"/><text x="423" y="501" text-anchor="middle" class="buslbl">GPIO×8</text>

  <!-- ===================== OLED (top-right, I2C) ===================== -->
  <g filter="url(#shadow)"><rect x="870" y="100" width="270" height="150" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="890" y="130" class="mod">📟 OLED SSD1306 (I2C)</text>
  <g class="pin">
    <text x="890" y="158">SDA</text><text x="1120" y="158" text-anchor="end" class="gpio" fill="#16a34a">GPIO21</text>
    <text x="890" y="180">SCL</text><text x="1120" y="180" text-anchor="end" class="gpio" fill="#16a34a">GPIO22</text>
    <text x="890" y="202">VCC</text><text x="1120" y="202" text-anchor="end" fill="#e11d48">3V3</text>
    <text x="890" y="224">GND</text><text x="1120" y="224" text-anchor="end" fill="#111827">GND</text>
  </g>
  <path class="wire" stroke="#16a34a" d="M870,180 C790,210 780,320 700,330"/>
  <rect x="757" y="238" width="46" height="20" rx="10" fill="#16a34a"/><text x="780" y="253" text-anchor="middle" class="buslbl">I2C</text>

  <!-- ===================== AS608 (right-mid, UART2) ===================== -->
  <g filter="url(#shadow)"><rect x="870" y="330" width="270" height="150" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="890" y="360" class="mod">👆 AS608 — Empreinte (UART2)</text>
  <g class="pin">
    <text x="890" y="388">TX (capteur)</text><text x="1120" y="388" text-anchor="end" class="gpio" fill="#7c3aed">GPIO16 (RX)</text>
    <text x="890" y="410">RX (capteur)</text><text x="1120" y="410" text-anchor="end" class="gpio" fill="#7c3aed">GPIO17 (TX)</text>
    <text x="890" y="432">VCC</text><text x="1120" y="432" text-anchor="end" fill="#e11d48">3V3</text>
    <text x="890" y="454">GND</text><text x="1120" y="454" text-anchor="end" fill="#111827">GND</text>
  </g>
  <path class="wire" stroke="#7c3aed" d="M870,405 C800,415 770,425 700,430"/>
  <rect x="757" y="398" width="60" height="20" rx="10" fill="#7c3aed"/><text x="787" y="413" text-anchor="middle" class="buslbl">UART2</text>

  <!-- ===================== Buzzer ===================== -->
  <g filter="url(#shadow)"><rect x="900" y="500" width="240" height="60" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="920" y="528" class="mod">🔔 Buzzer</text>
  <text x="1120" y="528" text-anchor="end" class="gpio" fill="#0891b2">GPIO15</text>
  <text x="920" y="548" class="note">+ vers GPIO, − vers GND</text>
  <path class="wire" stroke="#0891b2" d="M900,525 C820,522 760,521 700,520"/>

  <!-- ===================== LED statut ===================== -->
  <g filter="url(#shadow)"><rect x="900" y="585" width="240" height="60" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="920" y="613" class="mod">💡 LED statut</text>
  <text x="1120" y="613" text-anchor="end" class="gpio" fill="#ca8a04">GPIO12</text>
  <text x="920" y="633" class="note">via résistance 220Ω → GND</text>
  <path class="wire" stroke="#ca8a04" d="M900,610 C820,595 760,580 700,575"/>

  <!-- ===================== Power rail note ===================== -->
  <path class="wire" stroke="#e11d48" d="M500,560 C440,560 420,560 360,560" opacity="0.0"/>
  <g filter="url(#shadow)"><rect x="360" y="770" width="480" height="90" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="380" y="798" class="mod">⚡ Alimentation commune</text>
  <circle cx="392" cy="822" r="6" fill="#e11d48"/><text x="408" y="827" class="legend">3V3 → VCC de tous les modules</text>
  <circle cx="392" cy="846" r="6" fill="#111827"/><text x="408" y="851" class="legend">GND → masse commune (relier tous les GND)</text>

  <!-- ===================== Legend ===================== -->
  <g filter="url(#shadow)"><rect x="40" y="770" width="300" height="90" rx="12" fill="#fff" stroke="#e2e8f0"/></g>
  <text x="60" y="798" class="mod">Légende des bus</text>
  <g class="legend">
    <rect x="60" y="812" width="22" height="6" rx="3" fill="#2563eb"/><text x="90" y="819">SPI</text>
    <rect x="150" y="812" width="22" height="6" rx="3" fill="#16a34a"/><text x="180" y="819">I2C</text>
    <rect x="230" y="812" width="22" height="6" rx="3" fill="#7c3aed"/><text x="260" y="819">UART</text>
    <rect x="60" y="838" width="22" height="6" rx="3" fill="#ea580c"/><text x="90" y="845">GPIO</text>
    <rect x="150" y="838" width="22" height="6" rx="3" fill="#0891b2"/><text x="180" y="845">Buzzer</text>
    <rect x="230" y="838" width="22" height="6" rx="3" fill="#ca8a04"/><text x="260" y="845">LED</text>
  </g>

  <text x="860" y="700" class="note">⚠️ GPIO 0/2/12/15 sont des « strapping pins » :</text>
  <text x="860" y="718" class="note">vérifier les niveaux au démarrage si modifié.</text>
</svg>
