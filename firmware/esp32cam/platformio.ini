; Borne FaceID ESP32-CAM — capture et envoi de trames JPEG au backend.
; Build : pio run | Flash : pio run -t upload | Moniteur : pio device monitor
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
