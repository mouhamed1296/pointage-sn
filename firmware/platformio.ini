; Firmware de la borne de pointage — ESP32
; Build : pio run    |    Flash : pio run -t upload    |    Moniteur : pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs

lib_deps =
    miguelbalboa/MFRC522@^1.4.11            ; Lecteur RFID/NFC RC522
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.3  ; Capteur AS608/R307
    chris--a/Keypad@^3.1.1                  ; Clavier matriciel 4x4
    adafruit/Adafruit SSD1306@^2.5.13       ; Écran OLED
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
